name: CI

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:

jobs:
  build-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    name: linux-amd64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-15,         name: macos-amd64 }
          - { os: macos-latest,     name: macos-arm64 }
          - { os: windows-latest,   name: windows-amd64 }
          - { os: windows-11-arm,   name: windows-arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: "25"
          cache: gradle

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build AssetsTools.NET + C# harness (shared script)
        shell: bash
        run: |
          # Same script local devs run (./tools/build_ttmapgen_harness.py) — fetches the
          # pinned AssetsTools.NET commit from gradle.properties, builds the reference
          # DLLs, copies them into the harness lib/, and builds the harness. Requires
          # dotnet on PATH (set up above).
          python3 tools/build_ttmapgen_harness.py

      - name: Fetch test corpus (pinned upstream fixtures)
        shell: bash
        run: python3 tools/fetch_corpus.py

      - name: Verify corpus materialized
        shell: bash
        run: |
          set -e
          D=assetapi/src/test/resources/testassets
          test -f "$D/NOTICE.md" && echo "NOTICE.md present"
          test -f "$D/TestCommon/Data/AssetBundleTypeTreeVariations/v23_extracted/packedassets_assets_all.bundle" && echo "v23_extracted (tthm) present"
          test -f "$D/UnityRoyale/GameBuild/Unity Royale_Data/globalgamemanagers.assets" && echo "player .assets present"
          test -f "$D/unitypy/char_118_yuki.ab" && echo "UnityPy LFS bundle present"
          echo "total bundle/assets files: $(find "$D" -name '*.bundle' -o -name '*.assets' | wc -l)"

      - name: Build and test
        shell: bash
        run: ./gradlew build

      - name: Upload fat jars
        if: always() && env.ACTIONS_RUNTIME_TOKEN != ''
        uses: actions/upload-artifact@v5
        with:
          name: jars
          path: |
            assetcli/build/libs/assetcli.jar
            ttmapgen/build/libs/ttmapgen.jar
          if-no-files-found: ignore

  release:
    name: Release fat jar
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build fat jars
        run: |
          ./gradlew :assetcli:shadowJar :ttmapgen:shadowJar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            assetcli/build/libs/assetcli.jar
            ttmapgen/build/libs/ttmapgen.jar
          generate_release_notes: true
