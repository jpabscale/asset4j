build:
  maxIssues: 0

config:
  validation: false
  warningsAsErrors: false

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 25        # ported AssetsTools.NET C# serializer methods are legitimately large
  LongMethod:
    active: true
    threshold: 250       # same: statement-parallel ports produce big functions
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
  NestedBlockDepth:
    active: true
    threshold: 6
  TooManyFunctions:
    active: true
    thresholdInFiles: 100
    thresholdInClasses: 40
    thresholdInInterfaces: 40

exceptions:
  active: true
  PrintStackTrace:
    active: true
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - InterruptedException
      - MalformedInputException
      - NumberFormatException
      - IllegalStateException

naming:
  active: true
  # C#/Rust-parity mirroring keeps upstream PascalCase member/function names
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Za-z][A-Za-z0-9_]*'
    propertyPattern: '[A-Za-z][A-Za-z0-9]*'
  PackageNaming:
    active: true
    packagePattern: '[a-z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)*'

performance:
  active: true
  ArrayPrimitive:
    active: true
  ForEachOnArray:
    active: true

potentialBugs:
  active: true
  EqualsWithHashCodeExist:
    active: true
  InvalidRange:
    active: true

style:
  active: true
  MagicNumber:
    active: false        # binary-format parsing is full of structural constants
  MaxLineLength:
    active: false        # statement-parallel ports mirror upstream line shapes
  ReturnCount:
    active: false        # early-return guard chains are the ported idiom
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - 'Unused'
  WildcardImport:
    active: false        # test sources use them deliberately
